project_name: Project A - Regime-Aware Multi-Strategy Backtesting System
random_seed: 42

data:
  tickers:
    - SPY
    - QQQ
    - IWM
    - TLT
    - GLD
    - AAPL
    - MSFT
  benchmark: SPY
  start_date: "2015-01-01"
  end_date: auto
  refresh_data: true
  raw_data_path: data/raw
  processed_data_path: data/processed

strategies:
  momentum:
    enabled: true
    short_window: 50
    long_window: 200
    assets:
      - SPY
      - QQQ
      - IWM
      - AAPL
      - MSFT
  mean_reversion:
    enabled: true
    window: 20
    entry_threshold: 1.5
    exit_threshold: 0.5
    assets:
      - SPY
      - QQQ
      - IWM
      - TLT
      - GLD
  pairs_trading:
    enabled: true
    asset_x: AAPL
    asset_y: MSFT
    lookback_window: 63
    zscore_window: 20
    entry_threshold: 2.0
    exit_threshold: 0.5

hmm:
  n_regimes: 3
  covariance_type: full
  n_iter: 250
  random_state: 42

allocation:
  Bull:
    momentum: 0.70
    mean_reversion: 0.20
    pairs_trading: 0.10
  Bear:
    momentum: 0.20
    mean_reversion: 0.50
    pairs_trading: 0.30
  High Volatility:
    momentum: 0.10
    mean_reversion: 0.40
    pairs_trading: 0.50

backtest:
  initial_capital: 1.0
  transaction_cost_bps: 5.0
  periods_per_year: 252
  risk_free_rate: 0.0

outputs:
  figures_dir: outputs/figures
  reports_dir: outputs/reports
  metrics_filename: performance_metrics.csv
  strategy_metrics_filename: strategy_metrics.csv
  daily_results_filename: daily_results.csv
  transition_matrix_filename: transition_matrix.csv
  state_probabilities_filename: state_probabilities.csv
  dashboard_filename: performance_dashboard.html
